<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BEAVER RUN - Classic & Halloween</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#21152f;font-family:monospace}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100vw;height:min(calc(56.25vw + 92px),100vh);max-width:177.78vh;overflow:hidden;background:#21152f;touch-action:none}
#c{width:100%;height:calc(100% - 92px);object-fit:contain;object-position:top center;background:#251c48}
#controls{position:absolute;left:0;right:0;bottom:0;height:92px;display:flex;align-items:center;justify-content:flex-end;padding:0 18px;background:rgba(39,22,57,.97);z-index:5}
#controls:after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.18)}
canvas{display:block;width:100%;image-rendering:pixelated}
#hud{position:absolute;top:10px;left:12px;color:#fff;font-size:clamp(14px,2.2vw,24px);font-weight:bold;text-shadow:2px 2px #5b2a78;pointer-events:none}
#title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(28,16,48,.22);color:#fff7dc;text-shadow:3px 3px #5b2a78;pointer-events:none}
#title h1{font-size:clamp(32px,8vw,78px);margin:0;letter-spacing:4px}
#title p{font-size:clamp(12px,2.5vw,22px);margin-top:10px}
#jump{position:relative;right:auto;bottom:auto;width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:rgba(117,58,157,.95);color:#fff;font:bold 18px monospace;touch-action:none;box-shadow:0 2px 0 rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent;user-select:none}
#jump:active{transform:scale(.94);background:rgba(143,72,180,.95)}
#restart{display:none;position:absolute;left:50%;top:calc((100% - 92px)/2);transform:translate(-50%,-50%);padding:12px 22px;border:3px solid #fff;background:#713a8e;color:#fff7dc;font:bold 18px monospace}

#title.mode-title{background:rgba(20,18,35,.62);gap:8px;padding:12px;text-align:center;pointer-events:none}
#mode-select{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px;pointer-events:auto}
.mode-btn{font: bold clamp(14px,2.8vw,22px) monospace;padding:13px 18px;border:3px solid #fff;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.classic-btn{background:#3b8150;color:#fff}
.halloween-btn{background:#f28a2e;color:#301b45}
.mode-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#title .mode-foot{font-size:clamp(10px,1.8vw,15px);margin:4px 0 0;color:#fff4d5}

body.classic-mode,#game.classic-mode{background:#172b31}
body.classic-mode #controls{background:rgba(17,17,17,.96)}
body.classic-mode #jump{background:rgba(30,60,80,.9)}
body.classic-mode #restart{background:#263746}
</style>
</head>
